<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papel y Luna — POS</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/invoice.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="app-header">
    <img src="img/logo.png" alt="Logo Papel y Luna">
    <div>
      <h1>Papel y Luna</h1>
      <p>Papelería y miscelánea · Punto de venta</p>
    </div>
  </header>

  <nav class="app-nav">
    <button class="nav-btn activo" data-vista="venta">Venta</button>
    <button class="nav-btn" data-vista="productos">Productos</button>
  </nav>

  <main class="app-layout vista" id="vista-venta">

    <!-- CATÁLOGO -->
    <section class="catalog-section">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="buscador" placeholder="Buscar producto por nombre...">
      </div>

      <h2>Catálogo de productos</h2>
      <p class="catalog-count" id="contador-productos"></p>
      <div class="catalog-grid" id="catalogo-grid"></div>
    </section>

    <!-- VENTA ACTUAL -->
    <aside class="invoice-panel">
      <div class="panel-titulo">
        <h2>Venta actual</h2>
        <button id="btn-vaciar" class="btn-vaciar" title="Vaciar la venta">🗑️ Limpiar</button>
      </div>

      <div id="factura-lista"></div>
      <div id="factura-vacia">
        <p>Aún no has agregado productos.<br>Búscalos en el catálogo y dales "Agregar".</p>
      </div>

      <div class="campo">
        <label for="cliente">Cliente</label>
        <select id="cliente"><option value="">Sin cliente</option></select>
      </div>

      <div class="payment-methods-section">
        <p class="payment-title">Método de pago</p>
        <div class="payment-buttons" id="metodos-pago"></div>
      </div>

      <div class="campo" id="campo-recibido">
        <label for="recibido">Valor recibido</label>
        <input type="number" id="recibido" min="0" step="100" placeholder="0">
      </div>

      <div class="invoice-totals">
        <div class="row"><span>Subtotal</span><span id="factura-subtotal">$0</span></div>
        <div class="row total"><span>Total</span><span id="factura-total">$0</span></div>
        <div class="row" id="fila-cambio"><span>Cambio</span><span id="factura-cambio">$0</span></div>
        <button id="btn-cerrar" class="btn-cerrar">Cerrar venta</button>
      </div>
    </aside>

  </main>

  <!-- VISTA PRODUCTOS -->
  <main id="vista-productos" class="vista oculto">
    <div class="vista-cabecera">
      <h2>Productos</h2>
      <button id="btn-nuevo-producto" class="btn-guardar-factura">+ Nuevo producto</button>
    </div>
    <div id="tabla-productos" class="tabla-contenedor"></div>
  </main>

  <!-- MODAL: crear / editar producto -->
  <div id="modal-producto" class="modal-overlay oculto">
    <form id="form-producto" class="modal-card modal-form" novalidate>
      <h3 id="titulo-modal-producto">Nuevo producto</h3>
      <div class="campo campo-avanzado"><label for="p-codigo">Código</label><input id="p-codigo" type="text"></div>
      <div class="campo"><label for="p-nombre">Nombre</label><input id="p-nombre" type="text"></div>
      <div class="campo"><label for="p-categoria">Categoría</label><select id="p-categoria"></select></div>
      <div class="fila-campos">
        <div class="campo"><label for="p-precio">Precio</label><input id="p-precio" type="number" min="0" step="50"></div>
        <div class="campo"><label for="p-costo">Costo</label><input id="p-costo" type="number" min="0" step="50"></div>
      </div>
      <label class="campo-check campo-avanzado"><input id="p-seguimiento" type="checkbox"> Controlar inventario</label>
      <div class="campo campo-avanzado" id="p-stock-campo"><label for="p-stock">Stock</label><input id="p-stock" type="number" min="0" step="1"></div>
      <p id="p-error" class="p-error"></p>
      <div class="modal-buttons">
        <button type="button" id="p-cancelar" class="btn-modal-secundario">Cancelar</button>
        <button type="submit" id="p-guardar" class="btn-guardar-factura">Guardar</button>
      </div>
    </form>
  </div>

  <div id="notificacion" class="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
